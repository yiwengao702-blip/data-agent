services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: itwwy123
      MYSQL_USER: itwwy
      MYSQL_PASSWORD: itwwy123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci

  elasticsearch:
    build: ./elasticsearch
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # 显式限制 JVM 堆，避免单机内存不足时被 OOM Kill（exit 137）
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
  kibana:
    image: kibana:8.19.10
    container_name: kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: embedding
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      MODEL_ID: /models/bge-large-zh-v1.5
      MAX_CONCURRENT_REQUESTS: "16"
      MAX_BATCH_TOKENS: "16384"
    volumes:
      - ./embedding/bge-large-zh-v1.5:/models/bge-large-zh-v1.5

  # ---- data-agent 问数服务（本项目主程序） ----
  # 构建上下文为仓库根目录（../），与 mysql/qdrant/es/embedding 同处默认网络，
  # 故上游依赖 host 可直接用服务名（mysql / qdrant / elasticsearch / embedding）。
  data-agent:
    build:
      context: ..        # 仓库根目录（docker/ 的上一级）
      dockerfile: Dockerfile
    container_name: data-agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    # 从项目根目录的 .env 注入密钥（含 DATA_AGENT_LLM_API_KEY）；.env 已被 .gitignore 忽略
    env_file:
      - ../.env
    environment:
      # 指向容器内使用的 compose 网络配置（下游依赖 host 改为服务名）
      DATA_AGENT_CONFIG: conf/app_config.docker.yaml
    depends_on:
      - mysql
      - elasticsearch
      - qdrant
      - embedding
    healthcheck:
      # 复用 /api/health 真实探活；curl 已在镜像内安装（CMD-SHELL 才支持 || 逻辑）
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:
  es_data:
  qdrant_data:
