name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  smoke:
    # 离线冒烟自检：用 mock 后端把 12 节点问数链路跑通，无需任何真实依赖或 API Key
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 同步依赖（基于锁文件，可复现）
        run: uv sync --frozen

      - name: 编译校验（全量语法检查）
        run: uv run python -m compileall -q app test server.py

      - name: 离线冒烟测试（mock 后端）
        run: uv run env DATA_AGENT_CONFIG=conf/app_config.mock.yaml python test/smoke_test.py
